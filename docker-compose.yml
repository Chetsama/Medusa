services:
  f5-tts:
    build:
      context: ./tts
      dockerfile: Dockerfile
    container_name: f5-tts
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount voices folder so you can add new reference wavs/txts dynamically
      - ./tts/voices:/app/voices
      # Persist downloaded model weights across container restarts
      - f5_tts_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  f5_tts_cache:
